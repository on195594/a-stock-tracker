services:
  web:
    image: a-stock-tracker
    build: .
    container_name: a-stock-tracker-web
    restart: unless-stopped
    env_file: .web.env
    networks: [nginx-network]
    ports: ["127.0.0.1:8550:8550"]
    environment:
      APP_MODE: production
      PUBLIC_BASE_URL: https://stock.keyi.win
      HOST: 0.0.0.0
      PORT: 8550
      # Serve CanvasKit and Flutter fallback fonts from this origin, not gstatic/Google Fonts.
      FLET_WEB_NO_CDN: "true"
networks:
  nginx-network:
    external: true
