# A 股选股数据源 Registry
# Phase B: human-readable YAML style; tests parse with Python stdlib regex only.

fields:
  - field: roe_3y_avg
    owner: scorer_input
    requirement: required
    source_primary: tushare.fina_indicator.roe_waa_three_disclosed_annual_periods
    source_fallback: none
    cache: stock_fundamentals.data.roe_3y_avg
    refresh: weekly_materialized
    affects_scoring: true
    affects_outcome: false
    failure_behavior: mark_missing; data_quality_degrades

  - field: roe_latest
    owner: report_only_support
    requirement: degradable
    source_primary: tushare.fina_indicator.roe_waa_latest_disclosed_annual_period
    source_fallback: none
    cache: stock_fundamentals.data.roe_latest
    refresh: weekly_materialized
    affects_scoring: false
    affects_outcome: false
    failure_behavior: omit_roe_trend_warning_when_missing

  - field: net_profit_growth
    owner: scorer_input
    requirement: required
    source_primary: tushare.fina_indicator.netprofit_yoy_three_disclosed_annual_periods
    source_fallback: none
    cache: stock_fundamentals.data.net_profit_growth
    refresh: weekly_materialized
    affects_scoring: true
    affects_outcome: false
    failure_behavior: mark_missing; data_quality_degrades

  - field: debt_ratio
    owner: scorer_input
    requirement: required
    source_primary: tushare.fina_indicator.debt_to_assets_latest_effective_announcement
    source_fallback: none
    cache: stock_fundamentals.data.debt_ratio
    refresh: weekly_materialized
    affects_scoring: true
    affects_outcome: false
    failure_behavior: mark_missing; data_quality_degrades

  - field: gross_margin
    owner: scorer_input
    requirement: required
    source_primary: tushare.fina_indicator.grossprofit_margin_latest_effective_announcement
    source_fallback: none
    cache: stock_fundamentals.data.gross_margin
    refresh: weekly_materialized
    affects_scoring: true
    affects_outcome: false
    failure_behavior: mark_missing; data_quality_degrades; financial_industry_can_be_missing

  - field: pb_percentile_10y
    owner: scorer_input
    requirement: required
    source_primary: derived_from_tushare_daily_basic_pb_history_and_fina_indicator_bps
    source_fallback: none
    cache: stock_fundamentals.data.pb_percentile_10y
    refresh: daily_materialized_then_recomputed_in_memory
    affects_scoring: true
    affects_outcome: false
    failure_behavior: full_10y_only; insufficient_history_writes_null; data_quality_degrades

  - field: pe_ttm
    owner: scorer_input
    requirement: degradable
    source_primary: tushare.daily_basic.pe_ttm
    source_fallback: none
    cache: stock_fundamentals.data.pe_ttm
    refresh: weekday_1715_materialized
    affects_scoring: false
    affects_outcome: false
    failure_behavior: loss_company_can_be_null_with_NOT_APPLICABLE_LOSS; source_failure_blocks_materialization

  - field: pb
    owner: valuation_support
    requirement: required
    source_primary: tushare.daily_basic.pb
    source_fallback: none
    cache: stock_fundamentals.data.pb
    refresh: weekday_1715_materialized
    affects_scoring: true
    affects_outcome: false
    failure_behavior: missing_or_zero_blocks_materialization

  - field: dividend_yield
    owner: valuation_support
    requirement: degradable
    source_primary: tushare.daily_basic.dv_ttm
    source_fallback: none
    cache: stock_fundamentals.data.dividend_yield
    refresh: weekday_1715_materialized
    affects_scoring: false
    affects_outcome: false
    failure_behavior: legal_null_is_visible; source_failure_blocks_materialization

  - field: float_to_total_ratio
    owner: valuation_support
    requirement: degradable
    source_primary: tushare.daily_basic.circ_mv_div_total_mv
    source_fallback: none
    cache: stock_fundamentals.data.float_to_total_ratio
    refresh: weekday_1715_materialized
    affects_scoring: false
    affects_outcome: false
    failure_behavior: invalid_denominator_writes_null; source_failure_blocks_materialization

  - field: dps
    owner: dividend_fact
    requirement: degradable
    source_primary: tushare.dividend.cash_div_tax_latest_implemented_event
    source_fallback: none
    cache: stock_fundamentals.data.dps
    refresh: weekly_materialized
    affects_scoring: false
    affects_outcome: false
    failure_behavior: no_implemented_event_is_business_empty; source_failure_is_not_business_empty

  - field: moat_fixed
    owner: scorer_input
    requirement: fixed
    source_primary: local_qualitative_selector.existing_v2_or_v1
    source_fallback: weights.frameworks.A.fundamental.moat_fixed.phase1_fixed
    cache: qualitative_scores_v2_or_qualitative_scores; snapshot=predictions.qualitative_snapshot_json
    refresh: read_only_per_score
    affects_scoring: true
    affects_outcome: false
    failure_behavior: fallback_to_phase1_fixed

  - field: market_pos_fixed
    owner: scorer_input
    requirement: fixed
    source_primary: local_qualitative_selector.existing_v2_or_v1
    source_fallback: weights.frameworks.A.fundamental.market_pos_fixed.phase1_fixed
    cache: qualitative_scores_v2_or_qualitative_scores; snapshot=predictions.qualitative_snapshot_json
    refresh: read_only_per_score
    affects_scoring: true
    affects_outcome: false
    failure_behavior: fallback_to_phase1_fixed

  - field: sentiment_fixed
    owner: scorer_input
    requirement: fixed
    source_primary: local_qualitative_selector.existing_v2_or_v1
    source_fallback: weights.frameworks.A.valuation.sentiment_fixed.phase1_fixed
    cache: qualitative_scores_v2_or_qualitative_scores; snapshot=predictions.qualitative_snapshot_json
    refresh: read_only_per_score
    affects_scoring: true
    affects_outcome: false
    failure_behavior: fallback_to_phase1_fixed

  - field: bps
    owner: derived_support
    requirement: derived
    source_primary: tushare.fina_indicator.bps_latest_effective_announcement
    source_fallback: none
    cache: stock_fundamentals.data.bps
    refresh: weekly_materialized
    affects_scoring: true
    affects_outcome: false
    failure_behavior: mark_pb_percentile_missing_or_stale

  - field: pb_hist_monthly
    owner: derived_support
    requirement: derived
    source_primary: tushare.daily_basic.pb_month_end_history
    source_fallback: none
    cache: stock_fundamentals.data.pb_hist_monthly
    refresh: weekday_1715_materialized
    affects_scoring: true
    affects_outcome: false
    failure_behavior: mark_pb_percentile_missing_or_stale

  - field: report_period
    owner: audit_contract
    requirement: degradable
    source_primary: tushare.fina_indicator.end_date_selected_by_effective_announcement
    source_fallback: unknown_period_marker
    cache: predictions.report_period
    refresh: per_score
    affects_scoring: false
    affects_outcome: false
    failure_behavior: fallback_visible_in_report; do_not_block_scoring

  - field: price_at_score
    owner: score_snapshot
    requirement: required
    source_primary: tushare.daily_when_TUSHARE_TOKEN_configured
    source_fallback: none
    cache: predictions.price_at_score
    refresh: daily
    affects_scoring: true
    affects_outcome: true
    failure_behavior: mark_missing; skip_prediction_write

  - field: benchmark_30d
    owner: frozen_legacy
    requirement: historical_only
    source_primary: frozen_historical_value
    source_fallback: none
    cache: predictions.benchmark_30d
    refresh: never
    affects_scoring: false
    affects_outcome: false
    failure_behavior: no_new_writes; default_report_uses_index_prices.H00300

  - field: benchmark_60d
    owner: frozen_legacy
    requirement: historical_only
    source_primary: frozen_historical_value
    source_fallback: none
    cache: predictions.benchmark_60d
    refresh: never
    affects_scoring: false
    affects_outcome: false
    failure_behavior: no_new_writes; default_report_uses_index_prices.H00300

  - field: benchmark_90d
    owner: frozen_legacy
    requirement: historical_only
    source_primary: frozen_historical_value
    source_fallback: none
    cache: predictions.benchmark_90d
    refresh: never
    affects_scoring: false
    affects_outcome: false
    failure_behavior: no_new_writes; default_report_uses_index_prices.H00300

  - field: weights_hash
    owner: audit_contract
    requirement: required
    source_primary: md5_json_weights_frameworks_subtree
    source_fallback: none
    cache: predictions.weights_hash
    refresh: per_score
    affects_scoring: false
    affects_outcome: false
    failure_behavior: block_prediction_write_if_missing_or_conflict

  - field: framework
    owner: audit_contract
    requirement: required
    source_primary: configured_framework_A
    source_fallback: none
    cache: predictions.framework
    refresh: per_score
    affects_scoring: true
    affects_outcome: true
    failure_behavior: unsupported_framework_blocks_scoring

  - field: outcome_30d
    owner: frozen_legacy
    requirement: historical_only
    source_primary: frozen_historical_value
    source_fallback: none
    cache: predictions.outcome_30d
    refresh: never
    affects_scoring: false
    affects_outcome: false
    failure_behavior: no_new_writes; default_report_uses_daily_bars.adjusted_qfq

  - field: outcome_60d
    owner: frozen_legacy
    requirement: historical_only
    source_primary: frozen_historical_value
    source_fallback: none
    cache: predictions.outcome_60d
    refresh: never
    affects_scoring: false
    affects_outcome: false
    failure_behavior: no_new_writes; default_report_uses_daily_bars.adjusted_qfq

  - field: outcome_90d
    owner: frozen_legacy
    requirement: historical_only
    source_primary: frozen_historical_value
    source_fallback: none
    cache: predictions.outcome_90d
    refresh: never
    affects_scoring: false
    affects_outcome: false
    failure_behavior: no_new_writes; default_report_uses_daily_bars.adjusted_qfq

  - field: qualitative_snapshot
    owner: qualitative_support
    requirement: degradable
    source_primary: latest_local_qualitative_scores
    source_fallback: phase1_fixed_constants
    cache: qualitative_scores
    refresh: read_per_score_without_ttl
    affects_scoring: true
    affects_outcome: false
    failure_behavior: fallback_all_or_nothing_to_fixed_values; no_external_model_call

  - field: qfq_strategy_return
    owner: strategy_report
    requirement: required_for_default_report
    source_primary: tushare.pro_bar.qfq
    source_fallback: none
    cache: daily_bars.adjusted_qfq
    refresh: weekday_1600
    affects_scoring: false
    affects_outcome: true
    failure_behavior: omit_unaligned_sample; never_fallback_to_raw_price

  - field: csi300_total_return
    owner: strategy_report
    requirement: required_for_default_report
    source_primary: tushare.index_daily.H00300_CSI
    source_fallback: none
    cache: index_prices.H00300
    refresh: weekday_1600
    affects_scoring: false
    affects_outcome: true
    failure_behavior: report_unavailable; never_fallback_to_price_index

  - field: daily_bars
    owner: market_data_cache
    requirement: required_for_signal
    source_primary: tushare.daily_when_TUSHARE_TOKEN_configured
    source_fallback: none
    cache: daily_bars
    refresh: daily_incremental
    freshness_sla: latest_trade_day_or_previous_trade_day
    affects_scoring: true
    affects_signal: true
    affects_outcome: true
    failure_behavior: failed_with_structured_reason
    user_visible_impact: l3_coverage_drop_or_score_price_missing

  - field: daily_bars_volume_unit
    owner: market_data_cache
    requirement: required_for_signal
    source_primary: tushare.daily.vol
    source_fallback: none
    cache: provider_registry_assumption
    refresh: per_provider_release
    affects_scoring: false
    affects_signal: true
    affects_outcome: false
    failure_behavior: block_l3_if_unknown_or_mixed
    user_visible_impact: l3_window_rejected_if_volume_unit_unknown
