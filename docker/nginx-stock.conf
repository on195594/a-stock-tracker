# Log paths only: OAuth /oauth_callback query parameters include authorization codes.
log_format stock_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream stock_workbench {
    zone upstream_stock 64k;
    server a-stock-tracker-web:8550 max_fails=1 fail_timeout=2s;
    keepalive 32;
    keepalive_timeout 65s;
    keepalive_requests 100;
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name stock.keyi.win;

    # SSL
    ssl_certificate ssl/keyi.win.pem;
    ssl_certificate_key ssl/keyi.win.key;

    # Security headers: identical to the application's own CSP; no inline script or eval.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "same-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self'" always;
    add_header Permissions-Policy        "interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Logging & client body
    access_log log/stock_access.log stock_no_query;
    error_log log/stock_error.log warn;
    client_max_body_size 16m;

    # 0-RTT QUIC connection resumption. Early data can be replayed, so a request that
    # could change state is refused with 425 and the client retries after the handshake.
    ssl_early_data on;
    ssl_session_ticket_key ssl/ticket.key;
    set $early_side_effect "";
    if ($ssl_early_data = "1") {
        set $early_side_effect "early";
    }
    if ($request_method !~ ^(GET|HEAD)$) {
        set $early_side_effect "${early_side_effect}-write";
    }
    if ($early_side_effect = "early-write") {
        return 425;
    }

    # HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header QUIC-Status $http3;

    # OAuth codes never persist in access or error logs.
    location = /oauth_callback {
        access_log off;
        error_log /dev/null;
        proxy_pass http://stock_workbench;
        proxy_set_header Host $host;
        proxy_set_header Early-Data $ssl_early_data;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        include nginxconfig.io/proxy.conf;
    }

    # Server-rendered web (nginx never retries non-idempotent POSTs upstream).
    location / {
        proxy_pass http://stock_workbench;
        proxy_set_header Host $host;
        proxy_set_header Early-Data $ssl_early_data;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        include nginxconfig.io/proxy.conf;
    }

    # Additional config
    include nginxconfig.io/general.conf;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name stock.keyi.win;
    access_log log/stock_access.log stock_no_query;
    return 301 https://stock.keyi.win$request_uri;
}
