{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block main %}
<h1>登录</h1>
<p>本站只供所有者本人使用。登录后可发起研究、查看进度与报告。</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% if demo %}
<form method="post" action="/login/demo">
  <button class="btn" type="submit">进入合成演示</button>
</form>
<p class="muted">合成演示只在本机运行，不调用真实接口，不产生费用。</p>
{% else %}
<a class="btn" href="/oauth/start">使用 GitHub 登录</a>
{% if admin %}
<form method="post" action="/login/admin">
  <label class="field">
    <span>管理员账号</span>
    <input name="username" autocomplete="username" required>
  </label>
  <label class="field">
    <span>密码</span>
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="btn" type="submit">账号密码登录</button>
</form>
{% endif %}
{% endif %}
{% endblock %}
