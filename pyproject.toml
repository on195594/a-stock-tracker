[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = [
    "a_stock_tracker",
    "pipeline.py",
    "tests",
    "scripts/fetch_qfq_daily_bars_tushare.py",
]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
