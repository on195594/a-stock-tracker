[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = [
    "a_stock_tracker",
    "pipeline.py",
    "tests",
    "scripts/run_qualitative_v2_shadow.py",
    "scripts/run_qualitative_v2_m5.py",
    "scripts/build_qualitative_v2_m5_bundle.py",
    "scripts/prepare_qualitative_v2_m5_data_authorization.py",
    "scripts/build_qualitative_v2_m5_fundamentals_snapshot.py",
    "scripts/capture_qualitative_v2_m5_source_frontdoors.py",
    "scripts/capture_qualitative_v2_m5_source_ui_assets.py",
    "scripts/probe_qualitative_v2_m5_source_capability.py",
    "scripts/prepare_qualitative_v2_m5_quality_pilot.py",
    "scripts/run_qualitative_v2_m5_quality_pilot.py",
    "scripts/run_qualitative_v2_production.py",
    "scripts/check_qualitative_v2_production.py",
    "scripts/collect_qualitative_v2_production_contexts.py",
    "scripts/collect_qualitative_v2_orient_cable.py",
    "scripts/prepare_qualitative_v2_orient_cable_hybrid.py",
    "scripts/collect_qualitative_v2_selected_five.py",
    "scripts/export_m4_sampling_frame.py",
    "scripts/export_m4_sampling_frame_akshare.py",
    "scripts/export_m4_sampling_frame_akshare_szse_https.py",
    "scripts/export_m4_sampling_frame_historical_hybrid.py",
    "scripts/probe_m4_frame_source.py",
    "scripts/build_m4_frame_lite.py",
]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
