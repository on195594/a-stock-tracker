[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.mypy]
python_version = "3.13"
files = [
    "pipeline.py",
    "scorer.py",
    "gemini_scorer.py",
    "telegram_push.py",
    "config.py",
    "sheets_sync.py",
    "lib",
    "tests",
]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
