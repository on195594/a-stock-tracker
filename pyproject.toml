[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[tool.mypy]
python_version = "3.13"
files = [
    "pipeline.py",
    "scorer.py",
    "gemini_scorer.py",
    "telegram_push.py",
    "config.py",
    "sheets_sync.py",
    "lib",
    "tests",
    "qualitative_v2_types.py",
    "qualitative_v2_taxonomy.py",
    "qualitative_v2_validator.py",
    "qualitative_v2_schema.py",
    "qualitative_v2_prompt.py",
    "qualitative_v2_contract.py",
    "qualitative_v2_client.py",
    "qualitative_v2_shadow.py",
    "qualitative_v2_m5.py",
    "qualitative_v2_m5_bundle.py",
    "qualitative_v2_m5_data_auth.py",
    "qualitative_v2_audit.py",
    "qualitative_v2_audit_artifacts.py",
    "qualitative_v2_audit_review.py",
    "qualitative_v2_m4_capability.py",
    "qualitative_v2_m4_segmented_rest.py",
    "qualitative_v2_m4_segmented_core.py",
    "qualitative_v2_m4_segmented_runtime.py",
    "qualitative_v2_m4_segmented_verify.py",
    "scripts/run_qualitative_v2_shadow.py",
    "scripts/run_qualitative_v2_m5.py",
    "scripts/build_qualitative_v2_m5_bundle.py",
    "scripts/prepare_qualitative_v2_m5_data_authorization.py",
    "scripts/export_m4_sampling_frame.py",
    "scripts/export_m4_sampling_frame_akshare.py",
    "scripts/export_m4_sampling_frame_akshare_szse_https.py",
    "scripts/export_m4_sampling_frame_historical_hybrid.py",
    "scripts/probe_m4_frame_source.py",
    "scripts/build_m4_frame_lite.py",
]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
